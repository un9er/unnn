<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер штрих-/QR-кодов</title>
  <!-- Подключаем библиотеку html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      width: 360px;
      margin: 0 auto;
      position: relative;
    }
    /* Оверлей-прицел */
    .scan-overlay {
      border: 2px dashed #fa3c3c;
      position: absolute;
      top: 50px;
      left: 30px;
      width: 300px;
      height: 200px;
      pointer-events: none;
      box-sizing: border-box;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.2em;
    }
    .hint {
      margin-top: 5px;
      color: #777;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>Сканер кодов</h1>
  <div id="reader">
    <div class="scan-overlay"></div>
  </div>
  <div id="result"></div>
  <div class="hint">Наведите камеру на QR/штрих-код. Ожидаем заднюю камеру.</div>

  <script>
    // Извлекаем chat_id из параметров URL (если используется)
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chat_id') || '';

    // Укажите здесь URL вашего сервера, который примет результат
    // и отправит его обратно в бота (через Telegram API).
    // Например, если у вас есть Flask-роут "/scan_result"
    // На GitHub Pages нельзя принимать POST, нужен внешний сервер.
    const SERVER_URL = "https://example.com/scan_result";

    // Конфигурация для html5-qrcode
    // facingMode: { exact: "environment" } — требует заднюю камеру
    // Если нет задней камеры, браузер выберет любую доступную.
    const config = {
      fps: 25,
      qrbox: 250,
      disableFlip: false,
      videoConstraints: {
        facingMode: { exact: "environment" }
      },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    // При успешном сканировании
    function onScanSuccess(decodedText, decodedResult) {
      console.log("Сканировано:", decodedText);
      const resDiv = document.getElementById("result");
      resDiv.innerText = "Результат: " + decodedText;

      // Останавливаем скан
      html5QrCodeScanner.clear().then(_ => {
        console.log("Сканер остановлен.");

        // Отправляем результат на сервер (если нужно автопересылка в бота)
        // Передаём chatId, decodedText
        fetch(SERVER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            chat_id: chatId, 
            result: decodedText 
          })
        })
        .then(resp => resp.json())
        .then(data => {
          console.log("Результат отправлен на сервер:", data);
          // Можно показать пользователю статус
          // resDiv.innerText += "\nОтправлено боту!";
        })
        .catch(err => {
          console.error("Ошибка при отправке на сервер:", err);
        });

      }).catch(err => console.error("Ошибка при остановке:", err));
    }

    // При ошибке (неудачном сканировании)
    function onScanFailure(error) {
      // Можно игнорировать или отображать
      // console.warn("Ошибка сканирования:", error);
    }

    // Создаём объект сканера
    const html5QrCodeScanner = new Html5QrcodeScanner("reader", config, false);
    html5QrCodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
