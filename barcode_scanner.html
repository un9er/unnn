<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Telegram WebApp Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; text-align: center; }
    #reader { width: 100%; max-width: 500px; margin: 10px auto; }
    #status { margin: 10px; font-weight: bold; }
    #btnStop { margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Сканер (WebApp)</h2>
  <div id="reader"></div>
  <div id="status"></div>
  <script>
  // Инициализация Telegram WebApp
  const tg = window.Telegram.WebApp;  // доступно внутри вебаппа

  // Помечаем, что WebApp готов:
  tg.ready();

  // Настройки для html5-qrcode
  const config = {
    fps: 25,
    qrbox: { width: 250, height: 250 },
    disableFlip: false
  };

  // Callbacks
  function onScanSuccess(decodedText, decodedResult) {
    // Останавливаем сканер:
    scanner.clear().then(_ => {
      document.getElementById("status").innerText = "Сканировано: " + decodedText;
      // Отправляем данные боту
      tg.sendData(decodedText);
      // Закрываем вебапп (если нужно)
      // tg.close();
    });
  }

  function onScanFailure(error) {
    // Можно выводить в консоль
    // console.warn("Ошибка сканирования:", error);
  }

  // Создаем объект:
  const scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" }, // камера телефона
    config,
    onScanSuccess,
    onScanFailure
  ).catch(err => {
    document.getElementById("status").innerText = "Ошибка запуска сканера: " + err;
  });

  </script>
</body>
</html>
