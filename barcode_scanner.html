<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер кодов</title>
  <!-- Подключаем Telegram WebApp JS для sendData и close -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      width: 360px;
      margin: 0 auto;
      position: relative;
    }
    .scan-overlay {
      border: 2px dashed #fa3c3c;
      position: absolute;
      top: 50px;
      left: 30px;
      width: 300px;
      height: 200px;
      pointer-events: none;
      box-sizing: border-box;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Сканирование</h1>
  <div id="reader">
    <div class="scan-overlay"></div>
  </div>
  <div id="result"></div>
  <script>
    // Инициализируем Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Извлекаем параметры URL: context и chat_id
    const urlParams = new URLSearchParams(window.location.search);
    const context = urlParams.get('context') || 'none';
    const chatId = urlParams.get('chat_id') || '';

    // Конфигурация сканера: сразу запускаем заднюю камеру
    const config = {
      fps: 25,
      qrbox: 250,
      videoConstraints: { facingMode: { exact: "environment" } },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById("result").innerText = "Результат: " + decodedText;
      // Останавливаем сканер
      html5QrcodeScanner.clear().then(() => {
        // Отправляем данные в формате "context|decodedText"
        tg.sendData(context + "|" + decodedText);
        // Закрываем WebApp через 300 мс
        setTimeout(() => { tg.close(); }, 300);
      }).catch(err => {
        console.error("Ошибка остановки сканера:", err);
        tg.close();
      });
    }

    function onScanFailure(error) {
      console.warn("Ошибка сканирования:", error);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
