<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер кодов</title>
  <!-- Telegram WebApp JS (для Telegram.WebApp.close()) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- html5-qrcode библиотека -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0; 
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      margin: 0 auto;
      width: 360px;
      position: relative;
    }
    .scan-overlay {
      border: 2px dashed #fa3c3c;
      position: absolute;
      top: 50px;
      left: 30px;
      width: 300px;
      height: 200px;
      pointer-events: none;
      box-sizing: border-box;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Сканер штрих/QR</h1>

  <div id="reader">
    <!-- Оверлей-прицел -->
    <div class="scan-overlay"></div>
  </div>
  <div id="result"></div>

  <script>
    // 1) Подключаем Telegram WebApp
    const tg = window.Telegram.WebApp;

    // 2) Извлекаем chat_id из параметров URL (если нужно)
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chat_id') || '';

    // 3) URL вашего сервера, который примет результат и сделает sendMessage
    const SERVER_URL = "https://example.com/scan_result";

    // 4) Настройки html5-qrcode — сразу запускаем заднюю камеру
    const config = {
      fps: 25,
      qrbox: 250,
      // Указываем камеру environment
      videoConstraints: {
        facingMode: { exact: "environment" }
      },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    // 5) Функция при успешном сканировании
    function onScanSuccess(decodedText, decodedResult) {
      console.log("Сканировано:", decodedText);
      document.getElementById("result").innerText = "Результат: " + decodedText;

      // Останавливаем скан
      html5QrCodeScanner.clear().then(_ => {
        console.log("Сканер остановлен.");

        // Автоматически отправляем результат на ваш сервер,
        // чтобы тот переслал его в бота
        fetch(SERVER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: chatId,
            result: decodedText
          })
        })
        .then(resp => resp.json())
        .then(data => {
          console.log("Отправили на сервер, ответ:", data);
          // Через короткую задержку закрываем WebApp
          setTimeout(() => {
            tg.close(); // Закрываем мини-приложение, возвращаем пользователя в бот
          }, 500);
        })
        .catch(err => {
          console.error("Ошибка при отправке:", err);
          // Даже если ошибка, можно закрыть или предложить повтор
          tg.close();
        });

      }).catch(err => {
        console.error("Ошибка при остановке:", err);
        tg.close();
      });
    }

    // 6) Функция при неудачном сканировании (можно игнорировать)
    function onScanFailure(error) {
      // console.warn("Ошибка сканирования:", error);
    }

    // 7) Создаём объект сканера и запускаем
    const html5QrCodeScanner = new Html5QrcodeScanner("reader", config, /*verbose=*/false);
    html5QrCodeScanner.render(onScanSuccess, onScanFailure);

    // Расширяем WebApp (на весь экран), если нужно
    tg.expand();
  </script>
</body>
</html>
