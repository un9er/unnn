<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Сканер QR-кодов</title>
    <!-- Подключаем html5-qrcode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #reader { width: 500px; margin: auto; }
        h1 { text-align: center; }
    </style>
</head>
<body>
    <h1>Сканер QR-кодов</h1>
    <div id="reader"></div>
    <p id="result" style="text-align: center; font-size: 1.2em;"></p>
    <script>
        // Передаем chat_id из шаблона
        const chatId = "{{ chat_id }}";

        // Функция, вызываемая при успешном сканировании
        function onScanSuccess(decodedText, decodedResult) {
            console.log(`Сканирование успешно: ${decodedText}`);
            document.getElementById("result").innerText = "Сканировано: " + decodedText;
            // Останавливаем сканер
            html5QrcodeScanner.clear().then(_ => {
                // Отправляем результат на сервер
                fetch("/result", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: chatId, result: decodedText })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === "success") {
                        document.getElementById("result").innerText += "\nРезультат отправлен в Telegram.";
                    } else {
                        document.getElementById("result").innerText += "\nОшибка: " + data.error;
                    }
                })
                .catch(error => {
                    console.error("Ошибка:", error);
                    document.getElementById("result").innerText += "\nОшибка при отправке результата.";
                });
            }).catch(error => {
                console.error("Ошибка остановки сканера:", error);
            });
        }

        function onScanFailure(error) {
            // Можно выводить сообщения об ошибке или просто игнорировать
            console.warn(`Ошибка сканирования: ${error}`);
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }, false);
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
