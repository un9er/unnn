<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер кодов</title>
  <!-- Telegram WebApp JS для закрытия приложения -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      width: 360px;
      margin: 0 auto;
      position: relative;
    }
    /* Оверлей-прицел */
    .scan-overlay {
      border: 2px dashed #fa3c3c;
      position: absolute;
      top: 50px;
      left: 30px;
      width: 300px;
      height: 200px;
      pointer-events: none;
      box-sizing: border-box;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Сканирование кода</h1>
  <div id="reader">
    <div class="scan-overlay"></div>
  </div>
  <div id="result"></div>

  <script>
    // Инициализируем Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Извлекаем chat_id из URL (если передан)
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chat_id') || '';

    // URL вашего сервера, который принимает POST-запрос с результатом
    // Замените на ваш реальный URL (например, https://yourserver.com/scan_result)
    const SERVER_URL = "https://example.com/scan_result";

    // Конфигурация html5-qrcode с выбором задней камеры
    const config = {
      fps: 25,
      qrbox: 250,
      videoConstraints: {
        facingMode: { exact: "environment" }
      },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    // Функция, вызываемая при успешном сканировании
    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById("result").innerText = "Результат: " + decodedText;
      // Останавливаем сканер
      html5QrCodeScanner.clear().then(_ => {
        // Отправляем результат на сервер (если требуется)
        fetch(SERVER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            chat_id: chatId,
            result: decodedText
          })
        })
        .then(resp => resp.json())
        .then(data => {
          console.log("Результат отправлен на сервер:", data);
          // Закрываем WebApp через 500 мс
          setTimeout(() => { tg.close(); }, 500);
        })
        .catch(err => {
          console.error("Ошибка отправки:", err);
          tg.close();
        });
      }).catch(err => {
        console.error("Ошибка при остановке сканера:", err);
        tg.close();
      });
    }

    // Функция, вызываемая при неудаче сканирования (можно игнорировать)
    function onScanFailure(error) {
      // Можно выводить в консоль: console.warn(error);
    }

    // Создаем объект сканера и сразу запускаем его
    const html5QrCodeScanner = new Html5QrcodeScanner("reader", config, false);
    html5QrCodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
