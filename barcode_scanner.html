<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер кодов</title>
  <!-- Telegram WebApp JS для закрытия -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      width: 360px;
      margin: 0 auto;
      position: relative;
    }
    .scan-overlay {
      border: 2px dashed #fa3c3c;
      position: absolute;
      top: 50px;
      left: 30px;
      width: 300px;
      height: 200px;
      pointer-events: none;
      box-sizing: border-box;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Сканирование</h1>
  <div id="reader">
    <div class="scan-overlay"></div>
  </div>
  <div id="result"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран (по желанию)

    // Извлекаем context и chat_id из URL
    const urlParams = new URLSearchParams(window.location.search);
    const chatId = urlParams.get('chat_id') || '';
    const context = urlParams.get('context') || 'none';

    // Настройки для html5-qrcode
    const config = {
      fps: 25,
      qrbox: 250,
      // Пытаемся сразу заднюю камеру
      videoConstraints: { facingMode: { exact: "environment" } },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    function onScanSuccess(decodedText, decodedResult) {
      console.log("Сканировано:", decodedText);
      document.getElementById("result").innerText = "Результат: " + decodedText;
      html5QrcodeScanner.clear().then(_ => {
        // Отправляем данные прямо в бота
        // Формат: "context|decodedText"
        tg.sendData(context + "|" + decodedText);
        // Закрываем WebApp
        setTimeout(() => {
          tg.close();
        }, 300);
      });
    }

    function onScanFailure(error) {
      // Можно выводить в консоль: console.warn(error);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
