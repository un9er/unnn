<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Сканер кодов</title>
  <!-- Подключаем Telegram WebApp JS -->
  <script src="https://telegram.org/js/telegram-webapp.js"></script>
  <!-- Подключаем html5-qrcode (минимизированную версию) -->
  <script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      width: 300px;
      margin: 0 auto;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Сканирование</h1>
  <div id="reader"></div>
  <div id="result"></div>
  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // Получаем параметры URL: context и chat_id
    const urlParams = new URLSearchParams(window.location.search);
    const context = urlParams.get('context') || 'none';
    const chatId = urlParams.get('chat_id') || '';
    console.log("Параметры URL:", { context, chatId });
    
    // Функция при успешном сканировании
    function onScanSuccess(decodedText, decodedResult) {
      console.log("Сканирование успешно. Результат:", decodedText);
      document.getElementById("result").innerText = "Результат: " + decodedText;
      
      // Формируем строку для отправки: "context|barcode"
      const dataToSend = context + "|" + decodedText;
      console.log("Отправляем данные в бот:", dataToSend);
      
      // Отправляем данные в бот через Telegram WebApp API
      tg.sendData(dataToSend);
      
      // Останавливаем сканер и закрываем WebApp через 1 секунду
      html5QrcodeScanner.clear().then(() => {
        setTimeout(() => {
          console.log("Закрываем WebApp.");
          tg.close();
        }, 1000);
      }).catch(error => {
        console.error("Ошибка при остановке сканера:", error);
        setTimeout(() => {
          tg.close();
        }, 1000);
      });
    }
    
    // Функция обработки ошибок сканирования (для отладки)
    function onScanFailure(error) {
      console.warn("Ошибка сканирования:", error);
    }
    
    // Инициализация сканера
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,         // частота кадров
        qrbox: 250,      // размер окна сканирования в пикселях
        videoConstraints: { facingMode: { exact: "environment" } }
      },
      false
    );
    
    // Запуск сканера
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
