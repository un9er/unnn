<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сканер штрих-кодов</title>
  <!-- Подключаем Telegram WebApp JS -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем html5-qrcode (минимизированную версию) -->
  <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
    }
    h1 {
      margin: 10px 0;
    }
    #reader {
      width: 360px;
      margin: 0 auto;
      position: relative;
    }
    /* Можно добавить оверлей для визуального эффекта */
    .scan-overlay {
      border: 2px dashed #fa3c3c;
      position: absolute;
      top: 50px;
      left: 30px;
      width: 300px;
      height: 200px;
      pointer-events: none;
      box-sizing: border-box;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Сканирование штрих-кода</h1>
  <div id="reader">
    <!-- Если требуется оверлей, можно раскомментировать следующий div -->
    <!-- <div class="scan-overlay"></div> -->
  </div>
  <div id="result"></div>
  <script>
    console.log("Сканер запущен.");
    // Инициализация Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Извлекаем параметры URL: context и chat_id (например, context=new)
    const urlParams = new URLSearchParams(window.location.search);
    const context = urlParams.get('context') || 'none';
    const chatId = urlParams.get('chat_id') || '';
    console.log("Параметры URL:", { context, chatId });

    // Конфигурация сканера: fps, размер области сканирования, выбор задней камеры
    const config = {
      fps: 10,
      qrbox: 250,
      videoConstraints: {
        facingMode: { exact: "environment" }
      },
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    // Функция успешного считывания
    function onScanSuccess(decodedText, decodedResult) {
      console.log("Сканирование успешно, результат:", decodedText);
      document.getElementById("result").innerText = "Результат: " + decodedText;
      html5QrcodeScanner.clear().then(() => {
        // Формируем строку: контекст и штрих-код через разделитель "|"
        const dataToSend = context + "|" + decodedText;
        console.log("Отправляем данные в бот:", dataToSend);
        tg.sendData(dataToSend);
        // Немного задержки, чтобы данные точно отправились, затем закрываем WebApp
        setTimeout(() => {
          console.log("Закрываем WebApp.");
          tg.close();
        }, 1000);
      }).catch(err => {
        console.error("Ошибка остановки сканера:", err);
        tg.close();
      });
    }

    // Функция обработки ошибок сканирования
    function onScanFailure(error) {
      console.warn("Ошибка сканирования:", error);
    }

    // Инициализируем и запускаем html5QrcodeScanner
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
